    "pptool_spacewatch.py",
    "pptool_submit_ades_to_mpc.py",
    "pptool_wht_prime.py",
    "setup/telescopes.py",
    "tests/test_arc35arctic.py",
    "tests/test_arcsat.py",
    "tests/test_catalina_lemmon60.py",
    "tests/test_cfht_cfh12k.py",
    "tests/test_cfht_megacam.py",
    "tests/test_cometary_activity.py",
    "tests/test_cometary_student_stack.py",
    "tests/test_dima_export.py",
