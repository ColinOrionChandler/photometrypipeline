
[project]
name = "photometrypipeline"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Michael Mommert", email = "mommermiscience@gmail.com" },
    { name = "Colin Orion Chandler", email = "coc123@uw.edu" },
]
description = "Automated photometry pipeline for imaging data from small and medium-sized telescopes (fork of mommermi/photometrypipeline)"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "astroquery>=0.4.7",
    "future", # Python 2 compatibility shims (past.builtins.execfile, old_div); to be removed
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "requests",
    "scikit-image",
    "scipy",
]

[project.urls]
"Source Code" = "https://github.com/ColinOrionChandler/photometrypipeline"
"Upstream" = "https://github.com/mommermi/photometrypipeline"
"Documentation" = "https://photometrypipeline.readthedocs.io/"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
mpc = [
    "lxml", # ADES XML schema validation in pptool_mpcsubmission
]
legacy = [
    "callhorizons", # only used by pptool_psfsub
]
dev = [
    "jupyter", # Clears output from Jupyter notebooks
    "lxml",
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for static linting of files
]
# Command-line scripts that can be run after installing the package
[project.scripts]
photometrypipeline_version = "photometrypipeline_cli.photometrypipeline_version:main"

[build-system]
requires = [
    "setuptools>=77", # Used to build and package the Python project; >=77 for SPDX license strings
    "setuptools_scm>=8", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/photometrypipeline/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
# Phase 1 of the src/ migration: the pipeline modules still live at the repository root.
pythonpath = ["."]
addopts = "--doctest-modules --doctest-glob=*.rst -m 'not integration'"
markers = [
    "integration: runs Source Extractor/SCAMP/SWarp and queries online catalogs (pytest -m integration)",
    "network: needs internet access",
]
log_cli_level = "INFO"

[tool.ruff]
line-length = 110
# pre-commit passes file names explicitly; honor the excludes below anyway
force-exclude = true
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
    ]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]

[tool.ruff.format]
# TEMPORARY: legacy modules are reformatted in one dedicated commit (lint plan L1).
exclude = [
    "_pp_conf.py",
    "catalog.py",
    "diagnostics.py",
    "doc/conf.py",
    "pp_calibrate.py",
    "pp_combine.py",
    "pp_distill.py",
    "pp_extract.py",
    "pp_manident.py",
    "pp_photometry.py",
    "pp_prepare.py",
    "pp_register.py",
    "pp_run.py",
    "pp_setup.py",
    "pp_stackedphotometry.py",
    "pptool_arc35arctic.py",
    "pptool_arcsat.py",
    "pptool_catalina_lemmon60.py",
    "pptool_cfht_cfh12k.py",
    "pptool_cfht_megacam.py",
    "pptool_cometary_activity.py",
    "pptool_cometary_student_stack.py",
    "pptool_dima_export.py",
    "pptool_efosc2.py",
    "pptool_fink_cometary_activity.py",
    "pptool_forced_photometry.py",
    "pptool_mpcreport.py",
    "pptool_mpcsubmission.py",
    "pptool_panstarrs1.py",
    "pptool_pp_cutouts.py",
    "pptool_psfsub.py",
    "pptool_reduced_data.py",
